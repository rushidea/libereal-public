name: CI

on:
  push:
    branches: [main, staging-main]
  pull_request:
    branches: [main, staging-main]

env:
  AUTH_SECRET: ci-dummy-auth-secret-for-github-actions
  DATABASE_PATH: prisma/ci.db

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare database
        run: npx prisma db push
        env:
          DATABASE_URL: file:./prisma/ci.db

      - name: Run unit tests
        run: npm run test:run

  catalog-search-promotion-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare database
        run: npx prisma db push
        env:
          DATABASE_URL: file:./prisma/ci.db

      - name: Validate catalog, search, and synthetic promotion surfaces
        run: >-
          npm run test:run --
          src/test/product-search.test.ts
          src/test/product-variant-lookup.test.ts
          src/test/product-list-row.test.tsx
          src/test/cart-promotions.test.ts
          src/test/automatic-promotions.test.ts

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [catalog-search-promotion-validation]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare database
        run: npx prisma db push
        env:
          DATABASE_URL: file:./prisma/ci.db

      - name: Seed e2e product data
        run: npx tsx scripts/seed-e2e-ci.ts

      - name: Build application
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          CI: true

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-type, unit-tests, catalog-search-promotion-validation, e2e-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare database
        run: npx prisma db push
        env:
          DATABASE_URL: file:./prisma/ci.db

      - name: Build
        run: npm run build
