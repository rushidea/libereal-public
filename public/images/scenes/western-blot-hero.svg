<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="45%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="wbBand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0"/>
      <stop offset="35%" stop-color="#3b82f6" stop-opacity="0.55"/>
      <stop offset="65%" stop-color="#2563eb" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wbMembrane" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="480" fill="url(#wbBg)"/>
  <!-- gel comb -->
  <g opacity="0.35" fill="#60a5fa">
    <rect x="720" y="48" width="6" height="18" rx="1"/>
    <rect x="734" y="48" width="6" height="18" rx="1"/>
    <rect x="748" y="48" width="6" height="18" rx="1"/>
    <rect x="762" y="48" width="6" height="18" rx="1"/>
    <rect x="776" y="48" width="6" height="18" rx="1"/>
    <rect x="790" y="48" width="6" height="18" rx="1"/>
    <rect x="804" y="48" width="6" height="18" rx="1"/>
    <rect x="818" y="48" width="6" height="18" rx="1"/>
  </g>
  <!-- gel lanes -->
  <g opacity="0.18">
    <rect x="710" y="72" width="130" height="300" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <line x1="728" y1="72" x2="728" y2="372" stroke="#bfdbfe" stroke-width="1"/>
    <line x1="746" y1="72" x2="746" y2="372" stroke="#bfdbfe" stroke-width="1"/>
    <line x1="764" y1="72" x2="764" y2="372" stroke="#bfdbfe" stroke-width="1"/>
    <line x1="782" y1="72" x2="782" y2="372" stroke="#bfdbfe" stroke-width="1"/>
    <line x1="800" y1="72" x2="800" y2="372" stroke="#bfdbfe" stroke-width="1"/>
    <line x1="818" y1="72" x2="818" y2="372" stroke="#bfdbfe" stroke-width="1"/>
  </g>
  <!-- protein bands -->
  <g opacity="0.55">
    <rect x="724" y="118" width="18" height="5" rx="2.5" fill="url(#wbBand)"/>
    <rect x="742" y="145" width="18" height="4" rx="2" fill="url(#wbBand)"/>
    <rect x="760" y="132" width="18" height="6" rx="3" fill="url(#wbBand)"/>
    <rect x="778" y="168" width="18" height="5" rx="2.5" fill="url(#wbBand)"/>
    <rect x="796" y="126" width="18" height="4" rx="2" fill="url(#wbBand)"/>
    <rect x="814" y="152" width="18" height="5" rx="2.5" fill="url(#wbBand)"/>
    <rect x="724" y="220" width="18" height="4" rx="2" fill="url(#wbBand)"/>
    <rect x="760" y="238" width="18" height="5" rx="2.5" fill="url(#wbBand)"/>
    <rect x="796" y="214" width="18" height="6" rx="3" fill="url(#wbBand)"/>
  </g>
  <!-- membrane strip -->
  <rect x="880" y="96" width="220" height="250" rx="10" fill="url(#wbMembrane)" opacity="0.55" stroke="#93c5fd" stroke-width="1"/>
  <g opacity="0.45">
    <rect x="900" y="130" width="180" height="5" rx="2.5" fill="#2563eb"/>
    <rect x="900" y="165" width="140" height="4" rx="2" fill="#3b82f6"/>
    <rect x="900" y="198" width="160" height="5" rx="2.5" fill="#2563eb"/>
    <rect x="900" y="232" width="120" height="4" rx="2" fill="#60a5fa"/>
    <rect x="900" y="265" width="150" height="5" rx="2.5" fill="#2563eb"/>
  </g>
  <!-- antibody Y shapes -->
  <g fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.2">
    <g transform="translate(980, 60) scale(1.1)">
      <line x1="0" y1="0" x2="0" y2="42"/>
      <line x1="-22" y1="42" x2="0" y2="20"/>
      <line x1="22" y1="42" x2="0" y2="20"/>
    </g>
    <g transform="translate(1040, 340) scale(0.9)">
      <line x1="0" y1="0" x2="0" y2="36"/>
      <line x1="-18" y1="36" x2="0" y2="18"/>
      <line x1="18" y1="36" x2="0" y2="18"/>
    </g>
  </g>
  <!-- soft circles -->
  <circle cx="1020" cy="90" r="70" fill="#60a5fa" opacity="0.08"/>
  <circle cx="860" cy="390" r="90" fill="#2563eb" opacity="0.06"/>
</svg>
