<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- 渐变 - 深色背景 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1f1a"/>
      <stop offset="50%" stop-color="#0d2b24"/>
      <stop offset="100%" stop-color="#0f3529"/>
    </linearGradient>

    <!-- 分子节点渐变 -->
    <radialGradient id="nodeGrad1" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </radialGradient>

    <radialGradient id="nodeGrad2" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </radialGradient>

    <radialGradient id="nodeGrad3" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </radialGradient>

    <!-- 发光效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 模糊效果 -->
    <filter id="blur1">
      <feGaussianBlur stdDeviation="1"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1920" height="400" fill="url(#bgGrad)"/>

  <!-- 背景粒子 (微弱) -->
  <g opacity="0.15" filter="url(#blur1)">
    <circle cx="100" cy="350" r="40" fill="#10b981"/>
    <circle cx="1800" cy="80" r="60" fill="#059669"/>
    <circle cx="1600" cy="380" r="35" fill="#10b981"/>
    <circle cx="400" cy="50" r="25" fill="#6ee7b7"/>
    <circle cx="1400" cy="150" r="30" fill="#10b981"/>
    <circle cx="600" cy="380" r="45" fill="#059669"/>
    <circle cx="1200" cy="30" r="20" fill="#34d399"/>
  </g>

  <!-- 六边形网格 (DNA/分子结构暗示) -->
  <g stroke="#10b981" stroke-width="0.5" fill="none" opacity="0.12">
    <!-- 左上角六边形 -->
    <path d="M50,50 L100,25 L150,50 L150,100 L100,125 L50,100 Z"/>
    <path d="M120,30 L170,5 L220,30 L220,80 L170,105 L120,80 Z"/>
    <path d="M20,120 L70,95 L120,120 L120,170 L70,195 L20,170 Z"/>

    <!-- 右上角六边形 -->
    <path d="M1750,20 L1800,-5 L1850,20 L1850,70 L1800,95 L1750,70 Z"/>
    <path d="M1820,50 L1870,25 L1920,50 L1920,100 L1870,125 L1820,100 Z"/>

    <!-- 中部散落 -->
    <path d="M300,300 L350,275 L400,300 L400,350 L350,375 L300,350 Z" opacity="0.5"/>
    <path d="M1500,280 L1550,255 L1600,280 L1600,330 L1550,355 L1500,330 Z" opacity="0.5"/>
  </g>

  <!-- 分子连接线 -->
  <g stroke="#34d399" stroke-width="1" opacity="0.25">
    <!-- 大分子链 1 -->
    <line x1="200" y1="200" x2="350" y2="180"/>
    <line x1="350" y1="180" x2="480" y2="220"/>
    <line x1="480" y1="220" x2="600" y2="170"/>
    <line x1="600" y1="170" x2="750" y2="200"/>

    <!-- 大分子链 2 -->
    <line x1="1200" y1="300" x2="1350" y2="280"/>
    <line x1="1350" y1="280" x2="1500" y2="320"/>
    <line x1="1500" y1="320" x2="1650" y2="270"/>

    <!-- 垂直连接 -->
    <line x1="100" y1="80" x2="100" y2="180" opacity="0.4"/>
    <line x1="1800" y1="150" x2="1800" y2="250" opacity="0.4"/>
  </g>

  <!-- 主要分子节点 -->
  <g filter="url(#glow)">
    <!-- 分子簇 1 (左侧) -->
    <circle cx="200" cy="200" r="12" fill="url(#nodeGrad1)" opacity="0.8"/>
    <circle cx="350" cy="180" r="8" fill="url(#nodeGrad2)" opacity="0.6"/>
    <circle cx="480" cy="220" r="15" fill="url(#nodeGrad1)" opacity="0.7"/>
    <circle cx="600" cy="170" r="6" fill="url(#nodeGrad3)" opacity="0.5"/>
    <circle cx="750" cy="200" r="10" fill="url(#nodeGrad2)" opacity="0.6"/>

    <!-- 小辅助节点 -->
    <circle cx="270" cy="210" r="3" fill="#6ee7b7" opacity="0.4"/>
    <circle cx="420" cy="190" r="4" fill="#10b981" opacity="0.5"/>
    <circle cx="540" cy="240" r="3" fill="#34d399" opacity="0.4"/>
    <circle cx="680" cy="185" r="4" fill="#6ee7b7" opacity="0.5"/>

    <!-- 分子簇 2 (右侧) -->
    <circle cx="1200" cy="300" r="14" fill="url(#nodeGrad2)" opacity="0.75"/>
    <circle cx="1350" cy="280" r="9" fill="url(#nodeGrad1)" opacity="0.6"/>
    <circle cx="1500" cy="320" r="11" fill="url(#nodeGrad3)" opacity="0.7"/>
    <circle cx="1650" cy="270" r="7" fill="url(#nodeGrad2)" opacity="0.5"/>

    <!-- 小辅助节点 -->
    <circle cx="1280" cy="310" r="4" fill="#34d399" opacity="0.5"/>
    <circle cx="1420" cy="295" r="3" fill="#6ee7b7" opacity="0.4"/>
    <circle cx="1560" cy="340" r="4" fill="#10b981" opacity="0.5"/>

    <!-- 顶部节点 -->
    <circle cx="100" cy="80" r="8" fill="url(#nodeGrad3)" opacity="0.5"/>
    <circle cx="1800" cy="150" r="10" fill="url(#nodeGrad1)" opacity="0.6"/>

    <!-- 底部节点 -->
    <circle cx="400" cy="380" r="6" fill="url(#nodeGrad2)" opacity="0.4"/>
    <circle cx="1400" cy="390" r="8" fill="url(#nodeGrad1)" opacity="0.5"/>
  </g>

  <!-- 抗体形状示意 (简化的 Y 结构) -->
  <g fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.3" filter="url(#softGlow)">
    <!-- 抗体 1 -->
    <g transform="translate(900, 150)">
      <line x1="0" y1="0" x2="0" y2="60"/>
      <line x1="-30" y1="60" x2="0" y2="30"/>
      <line x1="30" y1="60" x2="0" y2="30"/>
      <circle cx="-30" cy="60" r="8" fill="#10b981" opacity="0.3"/>
      <circle cx="30" cy="60" r="8" fill="#10b981" opacity="0.3"/>
    </g>

    <!-- 抗体 2 (更大) -->
    <g transform="translate(1100, 200) scale(1.5)">
      <line x1="0" y1="0" x2="0" y2="50"/>
      <line x1="-25" y1="50" x2="0" y2="25"/>
      <line x1="25" y1="50" x2="0" y2="25"/>
      <circle cx="-25" cy="50" r="6" fill="#34d399" opacity="0.4"/>
      <circle cx="25" cy="50" r="6" fill="#34d399" opacity="0.4"/>
    </g>

    <!-- 抗体 3 -->
    <g transform="translate(800, 280) scale(0.8)">
      <line x1="0" y1="0" x2="0" y2="45"/>
      <line x1="-20" y1="45" x2="0" y2="22"/>
      <line x1="20" y1="45" x2="0" y2="22"/>
      <circle cx="-20" cy="45" r="5" fill="#10b981" opacity="0.35"/>
      <circle cx="20" cy="45" r="5" fill="#10b981" opacity="0.35"/>
    </g>
  </g>

  <!-- 荧光点装饰 -->
  <g fill="#6ee7b7" opacity="0.4">
    <circle cx="150" cy="150" r="2"/>
    <circle cx="450" cy="100" r="1.5"/>
    <circle cx="700" cy="250" r="2"/>
    <circle cx="1000" cy="350" r="1.5"/>
    <circle cx="1300" cy="50" r="2"/>
    <circle cx="1700" cy="300" r="1.5"/>
    <circle cx="1850" cy="200" r="2"/>
    <circle cx="50" cy="300" r="1.5"/>
    <circle cx="1900" cy="50" r="2"/>
  </g>

  <!-- 波浪线条 (表示细胞膜/边界) -->
  <g fill="none" stroke="#10b981" stroke-width="1" opacity="0.15">
    <path d="M0,350 Q200,330 400,350 T800,350 T1200,350 T1600,350 T1920,350" />
    <path d="M0,365 Q200,345 400,365 T800,365 T1200,365 T1600,365 T1920,365" opacity="0.5"/>
  </g>

</svg>