<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1350">
  <title>科研生活 Hero Mobile</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1080px; height: 1350px; margin: 0; overflow: hidden; background: #f5f5f7; }
    @font-face { font-family: "Hero CJK"; src: local("PingFang SC"); }
    body { font-family: "Hero CJK", Inter, Arial, sans-serif; }
    #research-life-mobile { position: relative; width: 1080px; height: 1350px; overflow: hidden; color: #17221e; }
    .canvas { position: absolute; inset: 0; background: #f5f5f7; }
    .headline { position: absolute; left: 72px; right: 72px; top: 92px; text-align: center; font-size: 70px; font-weight: 700; line-height: 1.12; letter-spacing: 0; will-change: transform, opacity; }
    .headline strong { color: #08785d; font-weight: 700; }
    .photo { position: absolute; overflow: hidden; border: 8px solid rgba(255,255,255,.97); border-radius: 30px; background: #e7ece9; box-shadow: 0 24px 62px rgba(34,55,47,.14), 0 4px 14px rgba(34,55,47,.06); transform-origin: 50% 50%; will-change: transform, opacity; }
    .photo img { width: 100%; height: 100%; display: block; object-fit: cover; }
    #mobile-photo-microscope { left: 90px; top: 286px; width: 900px; height: 530px; z-index: 3; }
    #mobile-photo-pipetting { left: 62px; top: 790px; width: 470px; height: 308px; transform: rotate(-1.8deg); }
    #mobile-photo-freezer { left: 548px; top: 790px; width: 470px; height: 308px; transform: rotate(1.8deg); }
    #mobile-photo-centrifuge { left: 110px; top: 1071px; width: 410px; height: 245px; transform: rotate(1.2deg); }
    #mobile-photo-result { left: 560px; top: 1071px; width: 410px; height: 245px; transform: rotate(-1.2deg); }
  </style>
</head>
<body>
  <div data-hf-id="hf-f1ul" id="research-life-mobile" data-composition-id="research-life-mobile" data-start="0" data-duration="10" data-width="1080" data-height="1350">
    <div data-hf-id="hf-nq1o" class="canvas"></div>
    <div data-hf-id="hf-qvty" id="mobile-headline" class="headline clip" data-start="0" data-duration="10" data-track-index="1">科研生活，<strong data-hf-id="hf-uzwc">全搞定。</strong></div>
    <div data-hf-id="hf-io7n" id="mobile-photo-pipetting" class="photo clip" data-start="0" data-duration="10" data-track-index="2">
      <img data-hf-id="hf-s1qk" src="assets/research-v2/pipetting-count.webp" alt="两位青年科研人员配合完成连续移液">
    </div>
    <div data-hf-id="hf-rcsn" id="mobile-photo-freezer" class="photo clip" data-start="0" data-duration="10" data-track-index="3">
      <img data-hf-id="hf-5ns7" src="assets/research-v2/freezer-samples.webp" alt="两位青年科研人员查找低温样本">
    </div>
    <div data-hf-id="hf-t32p" id="mobile-photo-centrifuge" class="photo clip" data-start="0" data-duration="10" data-track-index="4">
      <img data-hf-id="hf-3gzv" src="assets/research-v2/centrifuge-wait.webp" alt="两位青年科研人员等待离心结束">
    </div>
    <div data-hf-id="hf-9lff" id="mobile-photo-result" class="photo clip" data-start="0" data-duration="10" data-track-index="5">
      <img data-hf-id="hf-4368" src="assets/research-v2/gel-result.webp" alt="青年科研人员共同确认实验结果">
    </div>
    <div data-hf-id="hf-l4xt" id="mobile-photo-microscope" class="photo clip" data-start="0" data-duration="10" data-track-index="6">
      <img data-hf-id="hf-8yzo" src="assets/research-v2/microscope-discovery.webp" alt="两位青年科研人员观察显微图像">
    </div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#mobile-headline", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: .75, ease: "power2.out" }, .08);
    tl.fromTo("#mobile-photo-microscope", { y: 74, scale: .92, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 1, ease: "power3.out" }, .35);
    tl.fromTo("#mobile-photo-pipetting", { x: 54, y: -22, scale: .94, opacity: 0 }, { x: 0, y: 0, scale: 1, opacity: 1, duration: .82, ease: "power3.out" }, .72);
    tl.fromTo("#mobile-photo-freezer", { x: -54, y: -22, scale: .94, opacity: 0 }, { x: 0, y: 0, scale: 1, opacity: 1, duration: .82, ease: "power3.out" }, .82);
    tl.fromTo("#mobile-photo-centrifuge", { x: 46, y: -20, scale: .95, opacity: 0 }, { x: 0, y: 0, scale: 1, opacity: 1, duration: .76, ease: "power3.out" }, .96);
    tl.fromTo("#mobile-photo-result", { x: -46, y: -20, scale: .95, opacity: 0 }, { x: 0, y: 0, scale: 1, opacity: 1, duration: .76, ease: "power3.out" }, 1.05);
    tl.to("#mobile-photo-microscope", { scale: 1.018, duration: 5.8, ease: "sine.inOut" }, 1.4);
    tl.to("#mobile-photo-pipetting", { x: -7, y: 5, duration: 5.6, ease: "sine.inOut" }, 1.6);
    tl.to("#mobile-photo-freezer", { x: 7, y: 5, duration: 5.5, ease: "sine.inOut" }, 1.7);
    tl.to("#mobile-photo-centrifuge", { y: -4, duration: 5.3, ease: "sine.inOut" }, 1.8);
    tl.to("#mobile-photo-result", { y: -4, duration: 5.2, ease: "sine.inOut" }, 1.9);
    tl.to([".photo", "#mobile-headline"], { opacity: 0, duration: .7, ease: "power2.in" }, 9.08);
    window.__timelines["research-life-mobile"] = tl;
  </script>
</body>
</html>
