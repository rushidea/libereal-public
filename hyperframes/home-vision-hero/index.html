<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>

    html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: #f5f5f7; }
    @font-face { font-family: "Hero CJK"; src: local("PingFang SC"); }
    body { font-family: "Hero CJK", Inter, Arial, sans-serif; }
    #research-life-desktop { position: relative; width: 1920px; height: 1080px; overflow: hidden; color: #17221e; }
    .canvas { position: absolute; inset: 0; background: #f5f5f7; }
    .photo { position: absolute; overflow: hidden; border: 10px solid rgba(255,255,255,.96); border-radius: 34px; background: #e7ece9; box-shadow: 0 28px 72px rgba(34,55,47,.13), 0 4px 16px rgba(34,55,47,.07); transform-origin: 50% 50%; will-change: transform, opacity; }
    .photo img { width: 100%; height: 100%; display: block; object-fit: cover; }
    #desktop-photo-pipetting { left: 74px; top: 118px; width: 500px; height: 318px; transform: rotate(-2.4deg); }
    #desktop-photo-microscope { left: 547px; top: 68px; width: 826px; height: 530px; z-index: 4; }
    #desktop-photo-freezer { left: 1345px; top: 116px; width: 500px; height: 318px; transform: rotate(2.2deg); }
    #desktop-photo-centrifuge { left: 118px; top: 444px; width: 560px; height: 334px; transform: rotate(1.5deg); }
    #desktop-photo-result { left: 1242px; top: 438px; width: 560px; height: 340px; transform: rotate(-1.7deg); }
    .headline { position: absolute; left: 0; right: 0; top: 824px; text-align: center; font-size: 76px; font-weight: 700; line-height: 1.08; letter-spacing: 0; color: #17221e; will-change: transform, opacity; }
    .headline strong { color: #08785d; font-weight: 700; }
    .accent-line { position: absolute; left: 50%; top: 930px; width: 72px; height: 5px; border-radius: 99px; background: #0a8a69; transform-origin: 50% 50%; will-change: transform, opacity; }
  </style>
</head>
<body>

    tl.fromTo("#desktop-accent", { xPercent: -50, scaleX: 0, opacity: 0 }, { xPercent: -50, scaleX: 1, opacity: 1, duration: .58, ease: "power3.out" }, 1.3);
